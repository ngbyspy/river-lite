name: iOS test build

on:
  workflow_dispatch:
  push:
    branches:
      - build/ios-window-controls

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Show build tools
        run: |
          xcodebuild -version
          flutter --version
          git rev-parse HEAD
      - name: Validate iOS project
        run: |
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner.xcodeproj/project.pbxproj
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --build-number="${{ github.run_number }}" 2>&1 | tee ios-build.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry "RiverLite-ipados-window-controls-${{ github.run_number }}.ipa" Payload
          shasum -a 256 *.ipa > SHA256SUMS.txt
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RiverLite-iPadOS-window-controls-ipa
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 14
